#########################################################################################
# ToraMutton's Hyprland Configuration
#########################################################################################

### Monitor Settings ###
# Left: 27inch vertical (75Hz), Right: 24inch main (180Hz)
monitor = HDMI-A-1, 2560x1440@75, 0x0, 1, transform, 1
monitor = DP-2, 2560x1440@180, 1440x560, 1


### Program Definitions ###
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher
$mainMod = SUPER


### Auto-start Settings ###
# Run these tools in the background
exec-once = waybar
exec-once = mako
exec-once = fcitx5 -d
exec-once = swww-daemon

# クリップボード履歴の保存
exec-once = wl-paste --type text --watch cliphist store # テキスト
exec-once = wl-paste --type image --watch cliphist store # 画像

# Moving wallpapers
exec-once = mpvpaper -o "no-audio --loop" DP-2 ~/Downloads/arona-and-plana-blue-archive-moewalls-com.mp4
exec-once = mpvpaper -o "no-audio --loop --panscan=1.0 --video-align-x=0.25" HDMI-A-1 ~/Downloads/white-moonflower-field-katana-moewalls-com.mp4


### Environment Variables ###
# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Japanese input (fcitx5) and Firefox Wayland support
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
# env = GTK_IM_MODULE,fcitx
env = MOZ_ENABLE_WAYLAND,1

# Chromium/Electron系アプリをWaylandでネイティブ動作させる
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NIXOS_OZONE_WL,1


### Appearance ###
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Window border color (cyberpunk-style color)
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10           # 角丸具合
    rounding_power = 2
    active_opacity = 1.0    # 選択中の透明度
    inactive_opacity = 1.0  # 裏画面の透明度

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 10
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    # アニメーションのカーブ設定
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

################
# ワークスペースとモニターの紐づけ
################
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2

workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

################
# 入力デバイス 
################
input {
    kb_layout = jp
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}
gesture = 3, horizontal, workspace


######################
# キーボードショートカット
######################

# アプリ起動・システム操作
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, exec, vivaldi
bind = $mainMod, A, exec, antigravity
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, R, exec, killall waybar && waybar

# 便利系ショートカット
bind = $mainMod, W, fullscreen, 1             # フルスクリーン切替（Waybar残る）
bind = $mainMod SHIFT, W, fullscreen, 0       # 完全フルスクリーン
bind = $mainMod, L, exec, hyprlock            # 画面ロック
bind = $mainMod, B, exec, killall -SIGUSR1 waybar  # Waybar 表示/非表示切替
bind = $mainMod, Tab, cyclenext,              # 次のウィンドウへ（Alt+Tab風）
bind = $mainMod SHIFT, Tab, cyclenext, prev   # 前のウィンドウへ
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy # クリップボード履歴の呼び出し

# ウィンドウ操作系
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ワークスペース移動 (Super + 1~0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ウィンドウを別のワークスペースへ移動 (Super + Shift + 1~0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 特殊ワークスペース
bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# マウスでの画面切り替え・ウィンドウ操作
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#　スクリーンショット
# 1) アクティブウィンドウ保存 ＋ コピー ＋ 通知
bind = , Print, exec, hyprshot -m window -o ~/Pictures/screenshots

# 2) 範囲選択して保存 ＋ コピー ＋ 通知
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/screenshots

# 3) 全画面を保存 ＋ コピー ＋ 通知
bind = $mainMod, Print, exec, hyprshot -m output -o ~/Pictures/screenshots

# 4) 最新のスクショをswappyで開く
bind = $mainMod ALT, S, exec, sh -c 'swappy -f "$(ls -t ~/Pictures/screenshots/* | head -n 1)"'

# 音量・明るさ・メディアコントロール
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


################
# ウィンドウルール
################
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

# すりガラス効果(要改善)
windowrule {
    name = glass-kitty
    match:class = kitty
    opacity = 0.85 0.7
}

windowrule {
    name = glass-vscode
    match:class = ^(code|Code|antigravity|Antigravity)$
    opacity = 0.95 0.85
}

windowrule {
    name = glass-browser
    match:class = ^(vivaldi|Vivaldi|firefox|Firefox|chromium|Chromium|google-chrome|brave-browser)$
    opacity = 0.95 0.85
}

# layerrule = blur on, match:namespace waybar
layerrule {
    name = wlogout_blur
    match:namespace = wlogout
    blur = true
}

layerrule {
    name = wofi_blur
    match:namespace = wofi
    blur = true
}
