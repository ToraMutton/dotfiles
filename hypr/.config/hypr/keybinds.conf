######################
# キーボードショートカット
######################

# アプリ起動・システム操作
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, exec, google-chrome-stable
bind = $mainMod, A, exec, antigravity
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, R, exec, killall waybar && waybar

# 便利系ショートカット
bind = $mainMod, W, fullscreen, 1             # フルスクリーン切替（Waybar残る）
bind = $mainMod SHIFT, W, fullscreen, 0       # 完全フルスクリーン
bind = $mainMod, L, exec, hyprlock            # 画面ロック
bind = $mainMod, B, exec, killall -SIGUSR1 waybar  # Waybar 表示/非表示切替
bind = $mainMod, Tab, cyclenext,              # 次のウィンドウへ（Alt+Tab風）
bind = $mainMod SHIFT, Tab, cyclenext, prev   # 前のウィンドウへ
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy # クリップボード履歴の呼び出し

# ウィンドウ操作系
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ワークスペース移動 (Super + 1~0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ウィンドウを別のワークスペースへ移動 (Super + Shift + 1~0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 特殊ワークスペース
bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# マウスでの画面切り替え・ウィンドウ操作
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# モニター間のフォーカス・ウィンドウ移動
bind = $mainMod, comma,  focusmonitor, l
bind = $mainMod, period, focusmonitor, r
bind = $mainMod SHIFT, comma,  movewindow, mon:l
bind = $mainMod SHIFT, period, movewindow, mon:r
bind = $mainMod CTRL, comma,  movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, period, movecurrentworkspacetomonitor, r

# ウィンドウのリサイズ
bind = $mainMod ALT, left,  resizeactive, -50 0
bind = $mainMod ALT, right, resizeactive,  50 0
bind = $mainMod ALT, up,    resizeactive,  0 -50
bind = $mainMod ALT, down,  resizeactive,  0  50

# スクリーンショット
# 1) アクティブウィンドウ保存 ＋ コピー ＋ 通知
bind = , Print, exec, hyprshot -m window -o ~/Pictures/screenshots

# 2) 範囲選択して保存 ＋ コピー ＋ 通知
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/screenshots

# 3) 全画面を保存 ＋ コピー ＋ 通知
bind = $mainMod, Print, exec, hyprshot -m output -o ~/Pictures/screenshots

# 4) 最新のスクショをswappyで開く
bind = $mainMod ALT, S, exec, sh -c 'swappy -f "$(ls -t ~/Pictures/screenshots/* | head -n 1)"'

# 音量・明るさ・メディアコントロール
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# グループ（タブ）操作
bind = $mainMod, G, togglegroup,                    # グループ化（タブ化）
bind = $mainMod SHIFT, G, moveoutofgroup,            # グループ解除
bind = $mainMod ALT, Tab, changegroupactive, f       # グループ内タブ切り替え

# ウィンドウ管理の強化
bind = $mainMod SHIFT, left,  swapwindow, l          # ウィンドウの位置入れ替え
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up,    swapwindow, u
bind = $mainMod SHIFT, down,  swapwindow, d
bind = $mainMod, T, pin,                             # 常に最前面（フローティング時）
bind = $mainMod SHIFT, C, centerwindow,              # ウィンドウを画面中央に移動
bind = $mainMod SHIFT, F, togglefloating,            # float↔tile トグル

# ユーティリティ
bind = $mainMod, N, exec, makoctl restore            # 通知履歴表示
bind = $mainMod SHIFT, N, exec, makoctl dismiss -a   # 通知を全消し
bind = $mainMod SHIFT, E, exec, wlogout              # ログアウトメニュー
bind = $mainMod, D, exec, hyprpicker -a              # カラーピッカー（自動コピー）
bind = $mainMod SHIFT, L, exec, hyprlock && systemctl suspend  # スリープ + ロック

# キーボードからのメディア操作（メディアキーがないKB用）
bindel = $mainMod, F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = $mainMod, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod, F12, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = $mainMod SHIFT, P, exec, playerctl play-pause           # 再生/一時停止
bindl = $mainMod SHIFT, bracketleft, exec, playerctl previous   # 前のトラック
bindl = $mainMod SHIFT, bracketright, exec, playerctl next      # 次のトラック
