<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Custom styles. -->
  <link rel="stylesheet" type="text/css" href="./styles.css" />

  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Allows React to be run buildless via "text/babel" script below. -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
  import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
  import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
  import * as zebar from 'https://esm.sh/zebar@3.0';

  const providers = zebar.createProviderGroup({
    cpu: { type: 'cpu' },
    battery: { type: 'battery' },
    memory: { type: 'memory' },
    // weather: { type: 'weather' },
    network: { type: 'network' },
    audio: { type: 'audio' },
    media: { type: 'media' },
    glazewm: { type: 'glazewm' },
    date: { type: 'date', formatting: 'EEE d MMM HH:mm' }, // 時計
  });

  createRoot(document.getElementById('root')).render(<App />);

  function App() {
    const [output, setOutput] = useState(providers.outputMap);

    useEffect(() => {
      providers.onOutput(() => setOutput(providers.outputMap));
    }, []);

    return (
      <div id="app">
        {/* 左側：ワークスペースとメディア */}
        <div className="section left">
          <div className="workspaces">
            {output.glazewm?.currentWorkspaces.map(ws => (
              <div key={ws.name} className={`ws-dot ${ws.hasFocus ? 'active' : ''}`}>
                {ws.displayName ?? ws.name}
              </div>
            ))}
          </div>
          {output.media?.currentSession && (
            <div className="chip media">
              🎵 {output.media.currentSession.title.substring(0, 20)}...
            </div>
          )}
        </div>

        {/* 中央：時計 */}
        <div className="section center">
          <div className="time-chip">
            {output.date?.formatted}
          </div>
        </div>

        {/* 右側：システムステータス */}
        <div className="section right">
        
          {/* ネットワーク (Wi-FiならSSID、それ以外なら接続タイプを表示) */}
          {output.network?.defaultInterface && (
            <div className="chip net">
              {output.network.defaultInterface.type === 'wifi' ? (
                <><i className="ph ph-wifi-high"></i> {output.network.defaultInterface.ssid}</>
              ) : (
                <><i className="ph ph-plugs-connected"></i> {output.network.defaultInterface.type}</>
              )}
            </div>
          )}

          {/* オーディオ (音量) */}
          {output.audio?.defaultPlaybackDevice && (
            <div className="chip audio">
              <i className="ph ph-speaker-high"></i> {Math.round(output.audio.defaultPlaybackDevice.volume)}%
            </div>
          )}

          <div className="chip cpu">
            <i className="ph ph-cpu"></i> {Math.round(output.cpu?.usage)}%
          </div>

          <div className= {`chip mem ${output.memory?.usage > 80 ? 'danger' : ''}`}>
            <i className="ph ph-memory"></i> {Math.round(output.memory?.usage)}%
          </div>

          <div className={`chip bat ${output.battery?.chargePercent < 20 ? 'danger' : ''}`}>
            <i className="ph ph-battery-full"></i> {Math.round(output.battery?.chargePercent)}%
          </div>
        </div>
      </div>
    );
  }
</script>
</body>

</html>
