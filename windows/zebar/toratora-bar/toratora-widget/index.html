<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
  import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
  import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
  import * as zebar from 'https://esm.sh/zebar@3.0';

  const providers = zebar.createProviderGroup({
    cpu:     { type: 'cpu' },
    memory:  { type: 'memory' },
    battery: { type: 'battery' },
    network: { type: 'network' },
    audio:   { type: 'audio' },
    media:   { type: 'media' },
    glazewm: { type: 'glazewm' },
    date:    { type: 'date' },
  });

  createRoot(document.getElementById('root')).render(<App />);

  function App() {
    const [output, setOutput] = useState(providers.outputMap);
    const [showSec, setShowSec] = useState(false);
    const [commits, setCommits] = useState(null);
    const [gpuPct,  setGpuPct]  = useState(null);
    const [tempC,   setTempC]   = useState(null);
    const [vpnOn,   setVpnOn]   = useState(false);

    useEffect(() => {
      providers.onOutput(() => setOutput(providers.outputMap));
    }, []);

    // GPU usage via shellExec (every 3s)
    useEffect(() => {
      const poll = async () => {
        try {
          const r = await zebar.shellExec(
            'powershell',
            ['-NoProfile', '-command',
             "try{[int]((Get-Counter '\\GPU Engine(*engtype_3D*)\\Utilization Percentage' -EA Stop).CounterSamples|Measure-Object -Property CookedValue -Sum).Sum}catch{0}"]
          );
          const v = parseInt(r.stdout?.trim());
          setGpuPct(isNaN(v) || v === 0 ? null : Math.min(99, v));
        } catch { setGpuPct(null); }
      };
      poll();
      const id = setInterval(poll, 3000);
      return () => clearInterval(id);
    }, []);

    // CPU temperature via shellExec (every 10s)
    useEffect(() => {
      const poll = async () => {
        try {
          const r = await zebar.shellExec(
            'powershell',
            ['-NoProfile', '-command',
             "try{$t=(Get-CimInstance -Namespace root/WMI -ClassName MSAcpi_ThermalZoneTemperature -EA Stop).CurrentTemperature;if($t){[int]($t[0]/10-273.15)}else{0}}catch{0}"]
          );
          const v = parseInt(r.stdout?.trim());
          setTempC(isNaN(v) || v <= 0 ? null : v);
        } catch { setTempC(null); }
      };
      poll();
      const id = setInterval(poll, 10000);
      return () => clearInterval(id);
    }, []);

    // VPN detection via shellExec (every 15s)
    useEffect(() => {
      const poll = async () => {
        try {
          const r = await zebar.shellExec(
            'powershell',
            ['-NoProfile', '-command',
             "if((Get-NetAdapter -EA SilentlyContinue|Where-Object{$_.InterfaceDescription -match 'VPN|TAP|WireGuard|OpenVPN|Surfshark|NordVPN|ProtonVPN'}|Where-Object{$_.Status -eq 'Up'}).Count -gt 0){'on'}else{'off'}"]
          );
          setVpnOn(r.stdout?.trim() === 'on');
        } catch { setVpnOn(false); }
      };
      poll();
      const id = setInterval(poll, 15000);
      return () => clearInterval(id);
    }, []);

    // GitHub commit count (today, JST)
    useEffect(() => {
      const fetchCommits = async () => {
        try {
          const today = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD
          const res = await fetch('https://api.github.com/users/ToraMutton/events?per_page=100');
          if (!res.ok) return;
          const events = await res.json();
          const count = events
            .filter(e => e.type === 'PushEvent' && (e.created_at ?? '').startsWith(today))
            .reduce((sum, e) => sum + (e.payload?.commits?.length ?? 0), 0);
          setCommits(count);
        } catch { /* rate-limited or offline */ }
      };
      fetchCommits();
      const id = setInterval(fetchCommits, 5 * 60 * 1000);
      return () => clearInterval(id);
    }, []);

    // ── Time ───────────────────────────────────────────────
    const now = new Date();
    const DAY_JP = ['日','月','火','水','木','金','土'];
    const dayK = DAY_JP[now.getDay()];
    const mo   = String(now.getMonth() + 1).padStart(2, '0');
    const dy   = String(now.getDate()).padStart(2, '0');
    const hh   = String(now.getHours()).padStart(2, '0');
    const mm   = String(now.getMinutes()).padStart(2, '0');
    const ss   = String(now.getSeconds()).padStart(2, '0');

    // ── Data ───────────────────────────────────────────────
    const cpuPct = Math.round(output.cpu?.usage ?? 0);
    const memPct = Math.round(output.memory?.usage ?? 0);

    const bat   = output.battery;
    const vol   = output.audio?.defaultPlaybackDevice;
    const net   = output.network?.defaultInterface;
    const media = output.media?.currentSession;
    const wsList = output.glazewm?.currentWorkspaces ?? [];
    const focusedTitle = output.glazewm?.focusedContainer?.title ?? null;

    // Fixed-width 2-digit (figure-space pad)
    const n2 = v => String(Math.min(99, Math.max(0, Math.round(v)))).padStart(2, ' ');
    const n3 = v => String(Math.min(999, Math.max(0, Math.round(v)))).padStart(3, ' ');

    // Signal strength → 4 block chars
    const sigBars = s => {
      const filled = Math.round(Math.min(100, Math.max(0, s ?? 0)) / 25);
      return '▇'.repeat(filled) + '░'.repeat(4 - filled);
    };

    return (
      <div id="app">

        {/* ── LEFT: workspaces + window title ── */}
        <div className="section left">
          <div className="workspaces">
            {wsList.map(ws => (
              <span key={ws.name} className={ws.hasFocus ? 'ws-on' : 'ws-off'}>
                {ws.hasFocus ? `[${ws.displayName ?? ws.name}]` : (ws.displayName ?? ws.name)}
              </span>
            ))}
          </div>
          {focusedTitle && (
            <>
              <span className="sep-arrow"> › </span>
              <span className="win-title">
                {focusedTitle.length > 38 ? focusedTitle.slice(0, 38) + '…' : focusedTitle}
              </span>
            </>
          )}
        </div>

        {/* ── CENTER: clock ── */}
        <div className="section center">
          <span className="c-day">({dayK})</span>
          <span className="c-date">{mo}.{dy}</span>
          <span className="c-sep"> · </span>
          <span className="c-time" onClick={() => setShowSec(v => !v)} title="クリックで秒表示切替">
            {hh}<span className="c-colon">:</span>{mm}
            {showSec && <><span className="c-colon">:</span><span className="c-sec">{ss}</span></>}
          </span>
        </div>

        {/* ── RIGHT: stats ── */}
        <div className="section right">

          <span className="stat cpu">CPU:<span className="val">{n2(cpuPct)}</span></span>
          <span className="stat mem">MEM:<span className="val">{n2(memPct)}</span></span>
          {gpuPct !== null && <span className="stat gpu">GPU:<span className="val">{n2(gpuPct)}</span></span>}
          {tempC  !== null && <span className="stat temp"><span className="val-bare">{tempC}</span>°</span>}

          <span className="dot">·</span>

          {net && (
            <span className={`stat net${net.type === 'disconnected' ? ' net-dead' : ''}`}>
              <span className="sig">{sigBars(net.signalStrength)}</span>
              {' '}
              <span className="net-name">
                {net.type === 'wifi'
                  ? (net.ssid || 'WiFi')
                  : net.type === 'ethernet'
                  ? 'LAN'
                  : net.type === 'disconnected'
                  ? '──'
                  : net.type}
              </span>
            </span>
          )}

          <span className="dot">·</span>

          {vol && (
            <span className="stat vol">
              {vol.isMuted
                ? <span className="muted">VOL:──</span>
                : <>VOL:<span className="val">{n2(Math.round(vol.volume))}</span></>
              }
            </span>
          )}

          {bat && (
            <span className={`stat bat${bat.chargePercent < 15 && !bat.isCharging ? ' bat-crit' : ''}`}>
              {bat.isCharging ? '⚡' : '▲'}<span className="val-bat">{n3(bat.chargePercent)}</span><span className="pct-sign">%</span>
            </span>
          )}

          <span className="dot">·</span>

          {media?.title && (
            <span className="stat music">
              ♫{' '}
              {media.title.length > 20 ? media.title.slice(0, 20) + '…' : media.title}
            </span>
          )}

          {vpnOn && <span className="stat vpn">[VPN]</span>}

          {commits !== null && <span className="stat commits">↑{commits}</span>}

        </div>
      </div>
    );
  }
  </script>
</body>

</html>
