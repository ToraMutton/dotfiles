<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" />

  <link rel="stylesheet" type="text/css" href="./styles.css" />

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
  import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
  import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
  import * as zebar from 'https://esm.sh/zebar@3.0';

  const providers = zebar.createProviderGroup({
    cpu:     { type: 'cpu' },
    battery: { type: 'battery' },
    memory:  { type: 'memory' },
    network: { type: 'network' },
    audio:   { type: 'audio' },
    media:   { type: 'media' },
    glazewm: { type: 'glazewm' },
    date:    { type: 'date' },
  });

  createRoot(document.getElementById('root')).render(<App />);

  function App() {
    const [output, setOutput] = useState(providers.outputMap);

    useEffect(() => {
      providers.onOutput(() => setOutput(providers.outputMap));
    }, []);

    const now = new Date();
    const timeStr = new Intl.DateTimeFormat('ja-JP', {
      hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(now);
    const dateStr = new Intl.DateTimeFormat('ja-JP', {
      month: 'short', day: 'numeric', weekday: 'short',
    }).format(now);

    const focusedContainer = output.glazewm?.focusedContainer;
    const windowTitle = focusedContainer?.title ?? null;

    function BatteryIcon({ percent, isCharging }) {
      if (isCharging)   return <span className="ms-icon">bolt</span>;
      if (percent > 90) return <span className="ms-icon">battery_full</span>;
      if (percent > 60) return <span className="ms-icon">battery_5_bar</span>;
      if (percent > 30) return <span className="ms-icon">battery_3_bar</span>;
      if (percent > 10) return <span className="ms-icon">battery_1_bar</span>;
      return <span className="ms-icon">battery_0_bar</span>;
    }

    function VolumeIcon({ volume, isMuted }) {
      if (isMuted || volume === 0) return <span className="ms-icon">volume_off</span>;
      if (volume < 33)             return <span className="ms-icon">volume_mute</span>;
      if (volume < 66)             return <span className="ms-icon">volume_down</span>;
      return <span className="ms-icon">volume_up</span>;
    }

    function NetworkIcon({ type, signalStrength }) {
      if (type === 'wifi') {
        const s = signalStrength ?? 100;
        if (s > 66) return <span className="ms-icon">wifi</span>;
        if (s > 33) return <span className="ms-icon">wifi_2_bar</span>;
        return <span className="ms-icon">wifi_1_bar</span>;
      }
      return <span className="ms-icon">lan</span>;
    }

    return (
      <div id="app">

        {/* 左側：ワークスペース + アクティブウィンドウタイトル */}
        <div className="section left">
          <div className="workspaces">
            {output.glazewm?.currentWorkspaces.map(ws => (
              <div key={ws.name} className={`ws-pill ${ws.hasFocus ? 'active' : ''}`}>
                {ws.displayName ?? ws.name}
              </div>
            ))}
          </div>
          {windowTitle && <div className="divider" />}
          {windowTitle && (
            <div className="window-title">{windowTitle}</div>
          )}
        </div>

        {/* 中央：時計 */}
        <div className="section center">
          <div className="clock">
            <span className="clock-date">{dateStr}</span>
            <span className="clock-sep" />
            <span className="ms-icon clock-icon">schedule</span>
            <span className="clock-time">{timeStr}</span>
          </div>
        </div>

        {/* 右側：ステータスチップ */}
        <div className="section right">

          {output.media?.currentSession && (
            <div className="chip media">
              <span className="ms-icon">music_note</span>
              <span className="chip-label">
                {output.media.currentSession.title.substring(0, 16)}
                {output.media.currentSession.title.length > 16 ? '…' : ''}
              </span>
            </div>
          )}

          {output.network?.defaultInterface && (
            <div className="chip net">
              <NetworkIcon
                type={output.network.defaultInterface.type}
                signalStrength={output.network.defaultInterface.signalStrength}
              />
              {output.network.defaultInterface.type === 'wifi' && output.network.defaultInterface.ssid && (
                <span className="chip-label">
                  {output.network.defaultInterface.ssid.substring(0, 10)}
                </span>
              )}
            </div>
          )}

          {output.audio?.defaultPlaybackDevice && (
            <div className="chip audio">
              <VolumeIcon
                volume={output.audio.defaultPlaybackDevice.volume}
                isMuted={output.audio.defaultPlaybackDevice.isMuted}
              />
              <span className="chip-label">
                {Math.round(output.audio.defaultPlaybackDevice.volume)}%
              </span>
            </div>
          )}

          <div className={`chip cpu ${(output.cpu?.usage ?? 0) > 80 ? 'danger' : ''}`}>
            <span className="ms-icon">memory</span>
            <span className="chip-label">{Math.round(output.cpu?.usage ?? 0)}%</span>
          </div>

          <div className={`chip mem ${(output.memory?.usage ?? 0) > 80 ? 'danger' : ''}`}>
            <span className="ms-icon">database</span>
            <span className="chip-label">{Math.round(output.memory?.usage ?? 0)}%</span>
          </div>

          {output.battery && (
            <div className={`chip bat ${output.battery.chargePercent < 20 && !output.battery.isCharging ? 'danger' : ''}`}>
              <BatteryIcon
                percent={output.battery.chargePercent}
                isCharging={output.battery.isCharging}
              />
              <span className="chip-label">{Math.round(output.battery.chargePercent)}%</span>
            </div>
          )}

        </div>
      </div>
    );
  }
  </script>
</body>

</html>
